name: Deploy

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            export PATH=$PATH:/home/soumya/.npm-global/bin
             cd /var/www/vms
             git pull origin production
             
            cd backend/
            npm install
            pm2 reload vmsapi

            cd ../frontend
            npm install
            # Build next to the live site, carry over the previous version's files (tabs opened
            # before this deploy still load their pages), then swap folders — the live site is
            # never empty mid-build and never missing a file an open tab asks for.
            # Old files are dropped after 14 days.
            rm -rf dist-next
            if npm run build -- --outDir dist-next; then
              if [ -d dist/assets ]; then cp -rnp dist/assets/. dist-next/assets/; fi
              find dist-next/assets -type f -mtime +14 -delete
              rm -rf dist-prev
              if [ -d dist ]; then mv dist dist-prev; fi
              mv dist-next dist
            else
              echo "Frontend build failed - the live site was left as it was."
              exit 1
            fi
            
