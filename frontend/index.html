<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary Meta ─────────────────────────────────────────────────────── -->
    <title>OHPC VMS — Visitor Management System</title>
    <meta name="description" content="Visitor Management System of Odisha Hydro Power Corporation Ltd. — pre-approved, QR-coded and fully audited visitor access." />
    <meta name="application-name" content="OHPC VMS" />
    <meta name="author" content="Sobeit Technology Pvt. Ltd." />

    <!-- ── Icons (browser tab, Google search result, home screen) ────────────── -->
    <!-- Google shows a favicon that is a multiple of 48px and linked from the page -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- ── PWA / Web App ─────────────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#13315c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OHPC VMS" />

    <!-- ── Open Graph (link previews in Slack, WhatsApp, email etc.) ─────────── -->
    <meta property="og:title"       content="OHPC VMS — Visitor Management System" />
    <meta property="og:description" content="Visitor Management System of Odisha Hydro Power Corporation Ltd." />
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="OHPC VMS" />
    <meta property="og:image"       content="/brand/vms-logo-blue.png" />
    <meta property="og:locale"      content="en_IN" />

    <!-- ── Fonts ─────────────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Firebase reCAPTCHA container: must stay in DOM at all times (never unmount) -->
    <div id="recaptcha-container" style="position:fixed;bottom:0;right:0;z-index:-1;"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
